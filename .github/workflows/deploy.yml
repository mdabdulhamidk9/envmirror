name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages OIDC-based deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments concurrently; take the latest only.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        # actions/checkout v4 (pinned to commit: verified live v4 release head)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js 22
        # actions/setup-node v4 (pinned to commit: verified live v4 release head)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile-respecting)
        run: npm ci

      - name: Build (type check + Vite, repository subpath base)
        run: npm run build

      - name: Configure GitHub Pages
        # actions/configure-pages v5 (pinned to commit: verified live v5 release head)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload build output
        # actions/upload-pages-artifact v3 (pinned to commit: verified live v3 release head)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v4 (pinned to commit: verified live v4 release head)
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
